<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Лекарства</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <a class="back" href="{{ url_for('index') }}">← На главную</a>
    <h1>Лекарства</h1>

    <div class="filters">
        <input type="text" id="search" placeholder=" Поиск по названию/производителю...">
        <select id="f-manufacturer">
            <option value="">Все производители</option>
            {% for m in manufacturers %}<option>{{ m }}</option>{% endfor %}
        </select>
        <select id="f-form">
            <option value="">Все формы</option>
            {% for f in forms %}<option>{{ f }}</option>{% endfor %}
        </select>
        <select id="f-group">
            <option value="">Все фармгруппы</option>
            {% for g in groups %}<option>{{ g }}</option>{% endfor %}
        </select>
        <button id="reset" class="btn-secondary">Сбросить</button>
    </div>

    <p class="counter">Найдено: <span id="count">{{ drugs|length }}</span> из {{ drugs|length }}</p>

    <table id="drugs-table">
        <thead>
            <tr>
                <th>Название</th>
                <th>Производитель</th>
                <th>Форма выпуска</th>
                <th>Фармгруппа</th>
                <th>Общее имя</th>
            </tr>
        </thead>
        <tbody>
        {% for drug in drugs %}
            <tr
                data-name="{{ drug.drugName|lower }}"
                data-manufacturer="{{ drug.manufacturer }}"
                data-form="{{ drug.form }}"
                data-group="{{ drug.group }}"
                data-search="{{ (drug.drugName ~ ' ' ~ drug.manufacturer ~ ' ' ~ drug.common)|lower }}">
                <td><strong>{{ drug.drugName }}</strong></td>
                <td>{{ drug.manufacturer }}</td>
                <td>{{ drug.form }}</td>
                <td>{{ drug.group }}</td>
                <td>{{ drug.common }}</td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</div>

<script>
const search = document.getElementById('search');
const fMan = document.getElementById('f-manufacturer');
const fForm = document.getElementById('f-form');
const fGroup = document.getElementById('f-group');
const rows = Array.from(document.querySelectorAll('#drugs-table tbody tr'));
const countEl = document.getElementById('count');

function applyFilters() {
    const q = search.value.trim().toLowerCase();
    const man = fMan.value;
    const form = fForm.value;
    const grp = fGroup.value;
    let visible = 0;
    rows.forEach(r => {
        const ok =
            (!q || r.dataset.search.includes(q)) &&
            (!man || r.dataset.manufacturer === man) &&
            (!form || r.dataset.form === form) &&
            (!grp || r.dataset.group === grp);
        r.style.display = ok ? '' : 'none';
        if (ok) visible++;
    });
    countEl.textContent = visible;
}

[search, fMan, fForm, fGroup].forEach(el => {
    el.addEventListener('input', applyFilters);
    el.addEventListener('change', applyFilters);
});

document.getElementById('reset').addEventListener('click', () => {
    search.value = '';
    fMan.value = '';
    fForm.value = '';
    fGroup.value = '';
    applyFilters();
});
</script>
</body>
</html>
